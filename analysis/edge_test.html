<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>Edge TTS Test</title></head>
<body>
<h3>Edge 神经语音（晓晓 / 云希）连接测试</h3>
<p>说明：微软接口要求 User-Agent 带 <code>Edg/</code>，此测试仅在 <b>Edge 浏览器</b> 中能直连成功；其他浏览器请配置代理。</p>
<div id="log" style="white-space:pre-wrap;font-family:monospace"></div>
<script>
const logEl = document.getElementById('log');
function log(s){ logEl.textContent += s + '\n'; console.log(s); }
const TRUSTED = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
async function secMsGec(){
  let t = Date.now() / 1000;
  t += 11644473600;           // Windows 纪元偏移（秒）
  t -= t % 300;               // 按 300 秒取整
  t *= 1e7;                   // 100ns 单位
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(Math.round(t).toString() + TRUSTED));
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}
function msg(path, type, payload){
  return 'X-Timestamp:' + new Date().toUTCString() + '\r\nContent-Type:' + type + '\r\nPath:' + path + '\r\n\r\n' + payload;
}
function getPath(head){
  for (const line of head.split('\r\n')) if (line.indexOf('Path:') === 0) return line.slice(5).trim();
  return null;
}
(async () => {
  try {
    const sec = await secMsGec();
    const url = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=' + TRUSTED
      + '&ConnectionId=' + crypto.randomUUID().replace(/-/g, '')
      + '&Sec-MS-GEC=' + sec + '&Sec-MS-GEC-Version=1-143.0.3650.75';
    log('连接中...');
    const ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    let audioChunks = [];
    let totalBytes = 0;
    const to = setTimeout(() => { log('超时，收到字节: ' + totalBytes); try{ws.close();}catch(e){} }, 12000);
    ws.onopen = () => {
      log('已连接 ✓');
      ws.send(msg('speech.config','application/json; charset=utf-8', JSON.stringify({context:{synthesis:{audio:{metadataoptions:{wordBoundaryEnabled:'true'},outputFormat:'audio-24khz-48kbitrate-mono-mp3'}}}})));
      setTimeout(()=>{
        const ssml = "<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='zh-CN'><voice name='Microsoft Server Speech Text to Speech Voice (zh-CN, XiaoxiaoNeural)'><prosody pitch='+0Hz' rate='+0%' volume='+0%'>愿你平安喜乐，这是每日读经的语音测试。</prosody></voice></speak>";
        ws.send(msg('ssml','application/ssml+xml', ssml));
      }, 400);
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        const idx = ev.data.indexOf('\r\n\r\n');
        const head = idx >= 0 ? ev.data.slice(0, idx) : ev.data;
        if (getPath(head) === 'turn.end') {
          clearTimeout(to);
          log('成功！收到音频: ' + totalBytes + ' 字节');
          const blob = new Blob(audioChunks, {type:'audio/mpeg'});
          const u = URL.createObjectURL(blob);
          const a = new Audio(u);
          a.play().then(()=>log('正在播放 ✓ (晓晓)')).catch(e=>log('播放失败:'+e.message));
          ws.close();
        }
        return;
      }
      const buf = new Uint8Array(ev.data);
      if (buf.length < 2) return;
      const headerLen = (buf[0] << 8) | buf[1];
      if (headerLen + 2 > buf.length) return;
      const headStr = new TextDecoder().decode(buf.subarray(2, headerLen + 2));
      if (getPath(headStr) !== 'audio') return;
      const data = buf.subarray(headerLen + 2);
      if (data.length) { audioChunks.push(data); totalBytes += data.length; }
    };
    ws.onerror = (e) => { log('连接错误: ' + (e.message || 'unknown（非 Edge 浏览器通常被拒，请用 Edge 或配置代理）')); };
    ws.onclose = (e) => { if (e.code !== 1000) log('连接关闭 code=' + e.code); };
  } catch(e){ log('异常: ' + e.message); }
})();
</script></body></html>
